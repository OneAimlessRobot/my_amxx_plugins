
//styropyro
styropyro_level 23
styropyro_laser_ammo 13		//total # of shots given each round, -1 is unlimited
styropyro_laser_burndecals 1		//Show the burn decals on the walls
styropyro_cooldown 0.30			//Cooldown timer between laser use
styropyro_multishot -1		//Delay for multishots on holding key down, set to -1 for only 1 shot per keydown

echo "[SH] successfully executed sh_styropyro.cfg!"
