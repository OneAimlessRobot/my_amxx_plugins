
//Scorpion
scorpion_level 13
scorpion_maxhooks 15		//Max ammout of spears/hooks allowed, -1 is an unlimited ammount (Default 30)
scorpion_reelspeed 1000		//How fast hook line reels speared users in (Default 1000)
scorpion_dragmates 0		//Drag teammates, 0-no 1-yes
scorpion_knifefight 0		//Knife only with enemies you speared til death, 0-no 1-yes (Default 0)
scorpion_mode 1			//0-no xtra mode/dmg, 1-uppercut dmg, 2-line dmg and stun, 3-both 1 and 2 (Default 1)
//If scorpion_mode 1 or 3, this gets used:
scorpion_uppercutdmg 120		//Amount of Damage for uppercut performed when speared user is touched (Default 20)
//If scorpion_mode 2 or 3, these get used:
scorpion_speardmg 90		//Amount of Damage done when user is speared (Default 20)
scorpion_stuntime 3			//Seconds of stun when user is speared (Default 2)

echo "[SH] successfully executed sh_scorpion.cfg!"
