
//Vegetto
vegetto_level 37	//Level required to use (Default 10)
vegetto_aps 100	//The amount of AP gained per second (Default 5)
vegetto_ap_mult 400	//AP amount multiplied by ssjlevel = AP required for each ssjlevel and cost of ssjlevel power use (Default 250)
vegetto_hp_mult 300	//HP amount multiplied by ssjlevel, ex. 30*ssj2 = +60HP (Default 30)
vegetto_hp_max 1100	//Max HP that can be gained (Default 500)
vegetto_speed_base 750	//Initial Speed boost for ssjlevel 1, only sets if you are slower (Default 300)
vegetto_speed_add 100	//Speed added to vegetto_speedbase every next ssjlevel (Default 25)
vegetto_power_1 200	//Max Damage for ssjlevel 1 power (Default 70)
vegetto_power_2 350	//Max Damage for ssjlevel 2 power (Default 100)
vegetto_power_3 550	//Max Damage for ssjlevel 3 power (Default 175)
vegetto_power_4 1000	//Max Damage for ssjlevel 4 power (Default 300)
vegetto_radius_1 50	//Max Radius of Damage for ssjlevel 1th power (Default 100)
vegetto_radius_2 200	//Max Radius of Damage for ssjlevel 2th power (Default 300)
vegetto_radius_3 400	//Max Radius of Damage for ssjlevel 3th power (Default 700)
vegetto_radius_4 900	//Max Radius of Damage for ssjlevel 4th power (Default 1500)
vegetto_decals 1	//Show the burn decals on the walls (0-no 1-yes) (Default 1)
vegetto_powerup_explode_radius_ssj4 300

echo "[SH] successfully executed sh_vegetto.cfg!"
