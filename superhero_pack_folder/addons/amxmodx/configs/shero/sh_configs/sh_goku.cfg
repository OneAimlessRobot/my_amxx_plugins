
 //Goku
goku_level 15
goku_aps 70			//The amount of AP gained per second (Default 5)
goku_apl 250			//AP amount multiplied by ssjlevel = AP required for each ssjlevel and cost of ssjlevel power use (Default 250)
goku_hpl 140			//HP amount multiplied by ssjlevel, ex. 30*ssj2 = +60HP (Default 30)
goku_hpmax 400			//Max HP that can be gained (Default 500)
goku_speedbase 250		//Initial Speed boost for ssjlevel 1, only sets if you are slower (Default 300)
goku_speedadd 40		//Speed added to goku_speedbase every next ssjlevel (Default 25)
goku_damage1 70		//Max Damage for ssjlevel 1 power (Default 70)
goku_damage2 100		//Max Damage for ssjlevel 2 power (Default 100)
goku_damage3 350		//Max Damage for ssjlevel 3 power (Default 175)
goku_damage4 700		//Max Damage for ssjlevel 4 power (Default 300)
goku_radius1 100		//Max Radius of Damage for ssjlevel 1 power (Default 100)
goku_radius2 400		//Max Radius of Damage for ssjlevel 2 power (Default 300)
goku_radius3 700		//Max Radius of Damage for ssjlevel 3 power (Default 700)
goku_radius4 1000		//Max Radius of Damage for ssjlevel 4 power (Default 1500)
goku_powerup_explode_radius_ssj4 300		//Explode radius 3rd powerup (ssj4)
goku_blast_decals 1		//Show the burn decals on the walls (0-no 1-yes)

echo "[SH] successfully executed sh_goku.cfg!"
