#==============================================#
# PropManager by RedSMURF: Configuration file #
#==============================================#

# To add a new prop, follow the example below
# [Prop Name]
# PROP_MODEL                    = Path of prop's model
# PROP_FLAGS                    = a - Solid         b - Anim

# PROP_SEQUENCE                 = Animation sequence for the prop model
# PROP_FRAMERATE                = Animation frame rate for the prop model
# PROP_SPAWN_CHANCE             = Prop's respawn probability (0.0 = never, 1.0 = always)
# PROP_MINS                     = Minimum bounding box of the prop (x y z)
# PROP_MAXS                     = Maximum bounding box of the prop (x y z)

# To make an prop available in the menu, you must defined at least it's name like this [Alien]
# prop model and sound cannot be changed dynamically during gameplay

[Main Settings]
SETTING_DEFAULT_MODEL           = models/PropManager/6o4ka2.mdl
SETTING_DEFAULT_FLAGS           = a

SETTING_DEFAULT_FRAMERATE       = 1.0
SETTING_DEFAULT_SEQUENCE        = 0
SETTING_DEFAULT_SPAWN_CHANCE    = 1.0

SETTING_PROP_LOAD               = 1             # Whether to load saved props data of the current map
SETTING_PROP_CHECK              = 10.0          # Maximum selection distance when checking nearby props
SETTING_OFFSET_BASE             = 120.0         # Default forward offset when previewing prop placement
SETTING_OFFSET                  = 65.0 900.0    # Default minimum and maximum offset from the player to the prop (MIN MAX)
SETTING_OFFSET_STEP             = 10.0          # Step size when scrolling to move prop forward/backward
SETTING_GHOST_ALPHA             = 120           # Transparency level of the ghost preview model (0 - 255)

SETTING_SOUND_MENU_NAV          = buttons/blip1.wav
SETTING_SOUND_MENU_REMOVE       = buttons/button10.wav
SETTING_SOUND_MENU_ALERT        = buttons/bell1.wav

SETTING_COLOR_SELECT            = 0 255 0

